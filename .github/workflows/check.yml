name: Check

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        name: GitHub source cache
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-github-cache-${{ hashFiles('src/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-github-cache-

      - name: Install dependencies
        run: bun install

      - name: check building
        run: bun run build

      - name: check linting
        run: bun run lint
